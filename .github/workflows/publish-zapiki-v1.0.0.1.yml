name: Publish ZAPIKI v1.0.0.1 signed release after asset validation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-and-publish:
    if: startsWith(github.event.head_commit.message, 'Publish ZAPIKI 1.0.0.1 signed APKs')
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact asset names, sizes and SHA-256 then publish draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/443429395")"
          test "$(echo "$RELEASE" | jq -r .tag_name)" = "v1.0.0.1"
          if [ "$(echo "$RELEASE" | jq -r .draft)" != "true" ]; then
            echo "Release already published; refusing to change assets."
            exit 0
          fi
          if [ "$(echo "$RELEASE" | jq '.assets | length')" != 3 ]; then
            echo "::error::Expected exactly 3 assets on draft release."
            exit 1
          fi

          check_asset() {
            local name="$1" expected_size="$2" expected_hash="$3"
            local info
            info="$(echo "$RELEASE" | jq --arg name "$name" -c '.assets[] | select(.name == $name)')"
            test -n "$info" || { echo "::error::Missing $name"; exit 1; }
            local size digest
            size="$(echo "$info" | jq -r '.size')"
            digest="$(echo "$info" | jq -r '.digest')"
            if [ "$size" != "$expected_size" ] || [ "$digest" != "sha256:$expected_hash" ]; then
              echo "::error::$name SHA-256 or size mismatch: $size, $digest"
              exit 1
            fi
          }
          check_asset ZAPIKI_1.0.0.1_universal.apk 203960418 d973403ec9bd249f20a0400cfeef97725206a7787441bced788e0c7b99899080
          check_asset ZAPIKI_1.0.0.1_armeabi-v7a.apk 45007891 5858d8b9975653fbb5fa566841c00fb41edaca0656d7d63a87d0bc8798b2e770
          check_asset ZAPIKI_1.0.0.1_arm64-v8a.apk 57699851 ac9e26d752ec9fe57b3fcb976b07c6fc3c4fa69798379a083924a9a5575b125a
          cat > "$RUNNER_TEMP/published-notes.txt" <<'NOTES'
          ZAPIKI 1.0.0.1 (versionCode 214) — correctifs des conflits de sessions Supabase et des relevés de lecture.

          APK officiels signés avec la clé GogoStudio :
          - Universal : ZAPIKI_1.0.0.1_universal.apk — SHA-256 d973403ec9bd249f20a0400cfeef97725206a7787441bced788e0c7b99899080
          - ARM32 : ZAPIKI_1.0.0.1_armeabi-v7a.apk — SHA-256 5858d8b9975653fbb5fa566841c00fb41edaca0656d7d63a87d0bc8798b2e770
          - ARM64 : ZAPIKI_1.0.0.1_arm64-v8a.apk — SHA-256 ac9e26d752ec9fe57b3fcb976b07c6fc3c4fa69798379a083924a9a5575b125a

          Android 7.0+ ; application com.zapiki.tv ; certificat SHA-256 cd5e820127209680a7ac40d95a84896425f54b08ff55e37f73a10b23d1dcccd3.

          Ne pas confondre ces APK signés avec les APK de test debug du dépôt Zapiki-android.
          NOTES
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/443429395" -f body="$(cat "$RUNNER_TEMP/published-notes.txt")" -F draft=false > "$RUNNER_TEMP/published-release.json"
          test "$(jq -r .draft "$RUNNER_TEMP/published-release.json")" = "false"
          echo "ZAPIKI v1.0.0.1 signed APK release published successfully."
